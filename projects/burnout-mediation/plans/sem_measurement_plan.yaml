dr_step: D3_sem
plan_version: 2

inputs:
  analysis_plan: "plans/analysis_plan.yaml"
  synthetic_dataset: "data_synthetic/synthetic_dataset.csv"
  dataset_pattern: "pattern/dataset_pattern.csv"
  item_group_source: "user_confirmation"

constructs:
  - construct_name: "Job_Satisfaction"
    items:
      - "js_q1"
      - "js_q2"
      - "js_q3"
      - "js_q4"
      - "js_q5"
    item_source: "user_confirmation"
    response_range:
      min: 1
      max: 5
    reverse_coded_items: []
    reliability:
      metric: "cronbach_alpha_base_r"
      threshold_for_real_output: 0.70
      status: "pending_rstudio_output"
    scale_score:
      new_variable: "js_score"
      method: "row_mean"
      minimum_non_missing_proportion: 0.50

  - construct_name: "Burnout"
    items:
      - "bo_q1"
      - "bo_q2"
      - "bo_q3"
      - "bo_q4"
      - "bo_q5"
    item_source: "user_confirmation"
    response_range:
      min: 1
      max: 5
    reverse_coded_items: []
    reliability:
      metric: "cronbach_alpha_base_r"
      threshold_for_real_output: 0.70
      status: "pending_rstudio_output"
    scale_score:
      new_variable: "bo_score"
      method: "row_mean"
      minimum_non_missing_proportion: 0.50

measurement_model:
  estimator: "ML (default), ordered option documented in notes"
  lavaan_syntax: |
    Job_Satisfaction =~ js_q1 + js_q2 + js_q3 + js_q4 + js_q5
    Burnout =~ bo_q1 + bo_q2 + bo_q3 + bo_q4 + bo_q5
  fit_indices_to_report: ["cfi", "tli", "rmsea", "srmr"]
  fit_status: "pending_rstudio_output"

script:
  file: "scripts/sem_measurement.R"
  verified_on_synthetic: false
  note: "Synthetic fit values are meaningless by design; verification only proves the code runs."

user_confirmation:
  status: "confirmed"
  notes: "User confirmed no reverse coding; lavaan needs installation."

readiness:
  status: "ready"
  blocking_issues: []
  review_issues: []
  assumptions:
    - "Items are treated as continuous (ML estimator) for the core demo"
    - "No reverse coding needed"

next_step:
  skill: "dr-sem-02-structural-model"
